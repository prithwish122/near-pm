[workspace]
resolver = "3"
members = ["contracts/ebbflow", "contracts/test-token", "tests/integration"]
# Sandbox tests need libssl-dev and a prebuilt res/*.wasm; run them with `cargo test -p integration-tests`.
default-members = ["contracts/ebbflow", "contracts/test-token"]

[workspace.package]
edition = "2021"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"
uint = { version = "0.10", default-features = false }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
